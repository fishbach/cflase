    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        canvas {
            background-color: #a0a0a0;
            width: 95vmin;
            height: 95vmin;
        }
    </style>
</head>

<body>
    <canvas id="screen"></canvas>
    <script>
        const canvas = document.getElementById('screen');
        const ctx    = canvas.getContext('2d');

        function windowResized()
        {
            const size = canvas.clientWidth;
            canvas.width  = size;
            canvas.height = size;

            ctx.strokeStyle = '#0000ff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const center = size / 2;
            ctx.moveTo(0,    center);
            ctx.lineTo(size, center);
            ctx.moveTo(center, 0);
            ctx.lineTo(center, size);
            ctx.stroke();
        }
        addEventListener('load',   windowResized);
        addEventListener('resize', windowResized);

        let mouseX = 0;
        let mouseY = 0;
        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = -1 + (event.clientX - rect.left) / rect.width  * 2;
            mouseY =  1 - (event.clientY - rect.top ) / rect.height * 2;
        });

        function initLaser()
        {
            laser.errorCallback = (error) => {
                console.log('error:', error);
            };
            laser.activeCallback = (active) => {
                console.log('active:', active);
            };

            laser.scale(0.3, 0.3);
            laser.move(0.1, 0.2);

            laser.showFunc(mousePos);

            console.log("started ...");
        }

        function* lissajous()
        {
            const Pi = Math.PI;
            const fps = 50;
            const pc = laser.PPS / fps;
            const shiftPP = 2 * Pi / 4 / laser.PPS;

            let shift = 0;
            while (true) {
                for (let i = 0 ; i < pc ; ++i) {
                    yield new laser.Point({
                        x: Math.cos(2 * Pi * i / pc),
                        y: Math.sin(2 * Pi * i / pc + shift),
                        g: 45
                    });
                    shift += shiftPP;
                    if (shift > 2 * Pi) shift -= 2 * Pi;
                }
            }
        };

        function* mousePos()
        {
            const fps = 25;
            const pc = 4;
            const pDup = laser.PPS / pc / fps;
            while (true) {
                for (let i = 0 ; i < pDup ; ++i) yield new laser.Point({
                    x: mouseX,
                    y: mouseY,
                    g: 45
                });
                for (let i = 0 ; i < pDup ; ++i) yield new laser.Point({
                    x: mouseX + 0.25,
                    y: mouseY,
                    g: 45
                });
                for (let i = 0 ; i < pDup ; ++i) yield new laser.Point({
                    x: mouseX,
                    y: mouseY,
                    g: 45
                });
                for (let i = 0 ; i < pDup ; ++i) yield new laser.Point({
                    x: mouseX - 0.25,
                    y: mouseY,
                    g: 45
                });
            }
        }

    </script>
</body>
