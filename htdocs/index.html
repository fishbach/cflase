        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        canvas {
            background-color: #a0a0a0;

        }

<body>
    <canvas id="screen"></canvas>
    <script>
        const canvas = document.getElementById('screen');
        const ctx    = canvas.getContext('2d');

        function windowResized()
        {
            const size = canvas.clientWidth;
            canvas.width  = size;
            canvas.height = size;

            ctx.strokeStyle = '#0000ff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const center = size / 2;
            ctx.moveTo(0,    center);
            ctx.lineTo(size, center);
            ctx.moveTo(center, 0);
            ctx.lineTo(center, size);
            ctx.stroke();
        }
        addEventListener('load',   windowResized);
        addEventListener('resize', windowResized);

        let mouseX = 0;
        let mouseY = 0;
        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = -1 + (event.clientX - rect.left) / rect.width  * 2;
            mouseY =  1 - (event.clientY - rect.top ) / rect.height * 2;
            // laser.show([new laser.Point({
            //     x: mouseX,
            //     y: mouseY,
            //     g: 35
            // })], true);
        });

        function initLaser()
        {
            laser.errorCallback = (error) => {
                console.log('error:', error);
            };
            laser.activeCallback = (active) => {
                console.log('active:', active);
            };

            laser.scale(0.3, 0.3);
            laser.move(0.125, 0.2);

            laser.showFunc(fig);

            console.log("started ...");
        }

        function* lissajous()
        {
            const Pi = Math.PI;
            const fps = 80;
            const pc = laser.PointsPerSecond / fps;
            const shiftPP = 2 * Pi / 4 / laser.PointsPerSecond;

            let shift = 0;
            while (true) {
                for (let i = 0 ; i < pc ; ++i) {
                    yield new laser.Point({
                        x: Math.cos(2 * Pi * i / pc),
                        y: Math.sin(2 * Pi * i / pc + shift),
                        g: 45
                    });
                    shift += shiftPP;
                    if (shift > 2 * Pi) shift -= 2 * Pi;
                }
            }
        };

        function* beams()
        {
            const fps = 80;
            const pc = 5;
            const pDup = laser.PointsPerSecond / pc / fps;

            function* point(x, y, g)
            {
                for (let i = 0 ; i < pDup ; ++i) yield new laser.Point({
                    x: x,
                    y: y,
                    g: g
                });
            }

            while (true) {
                yield* point( 1,  1, 45);
                yield* point(-1,  1, 0);
                yield* point(-1, -1, 45);
                yield* point( 0,  0, 45);
                yield* point( 1, -1, 45);
            }
        }

        function* fig()
        {
            const fps = 80;
            const pc  = laser.PointsPerSecond / fps;
            const g   = 45;
            console.log('pc:', pc);

            function* line(x1, y1, x2, y2, pc)
            {
                for (let i = 0 ; i < pc ; ++i) yield new laser.Point({
                    x: x1 + (x2 - x1) * i / pc,
                    y: y1 + (y2 - y1) * i / pc
                });
            }

            function* lines()
            {
                while (true) {
                    yield* line( 1  ,  1  ,  0  ,  0.2, pc / 8);
                    yield* line( 0  ,  0.2, -1  ,  1  , pc / 8);
                    yield* line(-1  ,  1  , -0.2,  0  , pc / 8);
                    yield* line(-0.2,  0  , -1  , -1  , pc / 8);
                    yield* line(-1  , -1  ,  0  , -0.2, pc / 8);
                    yield* line( 0  , -0.2,  1  , -1  , pc / 8);
                    yield* line( 1  , -1  ,  0.2,  0  , pc / 8);
                    yield* line( 0.2,  0  ,    1,  1  , pc / 8);
                }
            }

            let sq = lines();
            let c = 0;
            let i = 0;
            while (true)
            {
                let p = sq.next().value;
                ++i;
                if      (i <  pc / 100) p.g = 45;
                else if (i >= pc /  40) i = 0;
                if (++c > 600) {
                    c = 0;
                    ++i;
                }
                yield p;
            }
        }

    </script>
</body>
